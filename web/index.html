<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>캣히어로 960 서버 게시판</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header class="top"><div class="wrap nav"><div class="brand">🐾 캣히어로 <span>960 SERVER</span></div><button id="nickBtn" class="ghost">닉네임 설정</button></div></header>
<main class="wrap"><section class="hero"><div><p class="eyebrow">960 SERVER COMMUNITY</p><h1>캣히어로 960 서버 게시판</h1><p>가입 없이 바로 글을 남겨보세요. 게스트 닉네임은 이 브라우저에서 임시로 사용됩니다.</p></div><button id="writeBtn" class="primary">✎ 글쓰기</button></section>
<section class="toolbar"><div><strong id="count">0</strong>개의 글</div><button id="refreshBtn" class="ghost">새로고침</button></section><section id="posts" class="board"></section></main>
<dialog id="writeDialog"><form id="postForm" enctype="multipart/form-data"><div class="dialogHead"><h2>새 글</h2><button type="button" class="x" data-close>×</button></div><label>닉네임<input name="nickname" id="postNick" maxlength="24" required></label><label>제목<input name="title" maxlength="120" required></label><label>내용<textarea name="body" maxlength="10000" rows="8" required></textarea></label><label>사진 <span class="muted">최대 10MB · JPG/PNG/WEBP</span><input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button type="button" class="ghost" data-close>취소</button><button class="primary">등록</button></div></form></dialog>
<dialog id="postDialog"><div id="postDetail"></div></dialog>
<dialog id="nickDialog"><form id="nickForm"><div class="dialogHead"><h2>게스트 닉네임</h2><button type="button" class="x" data-close>×</button></div><p class="muted">로그인 없이 이 브라우저에서 사용할 임시 닉네임입니다.</p><input id="nickInput" maxlength="24" required><div class="actions"><button type="button" class="ghost" data-close>취소</button><button class="primary">저장</button></div></form></dialog>
<div id="toast"></div><script src="/assets/app.js" defer></script></body></html>
