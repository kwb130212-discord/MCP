<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><meta name="color-scheme" content="dark light"><title>캣히어로 960 서버 게시판</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="top"><div class="wrap nav"><div class="brand">🐾 캣히어로 <span>960 SERVER</span></div><div class="navActions"><button id="themeBtn" class="ghost">◐ 테마</button><button id="adminBtn" class="ghost">관리</button><button id="nickBtn" class="ghost">닉네임</button></div></div></header><main class="wrap"><section class="hero"><div><p class="eyebrow">960 SERVER COMMUNITY</p><h1>캣히어로 960 서버 게시판</h1><p>가입 없이 글과 사진을 남길 수 있는 익명 커뮤니티</p></div><button id="writeBtn" class="primary">✎ 글쓰기</button></section><section class="categories" id="categories"><button class="category active" data-category="전체">전체</button><button class="category" data-category="질문">질문</button><button class="category" data-category="공략">공략</button><button class="category" data-category="공지">공지</button><button class="category" data-category="제재로그">제재로그</button><button class="category" data-category="자유게시판">자유게시판</button></section><section class="toolbar"><div><strong id="count">0</strong>개의 글</div><button id="refreshBtn" class="ghost">새로고침</button></section><section id="posts" class="board"></section></main><dialog id="writeDialog"><form id="postForm" enctype="multipart/form-data"><div class="dialogHead"><h2>새 글</h2><button type="button" class="x" data-close>×</button></div><label>게시판<select name="category" required><option value="질문">질문</option><option value="공략">공략</option><option value="공지">공지</option><option value="제재로그">제재로그</option><option value="자유게시판" selected>자유게시판</option></select></label><label>제목<input name="title" maxlength="120" required></label><label>내용<textarea name="body" maxlength="10000" rows="8" required></textarea></label><label>사진 <span class="muted">최대 10MB · JPG/PNG/WEBP</span><input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button type="button" class="ghost" data-close>취소</button><button class="primary">등록</button></div></form></dialog><dialog id="postDialog"><div id="postDetail"></div></dialog><dialog id="nickDialog"><form id="nickForm"><div class="dialogHead"><h2>게스트 닉네임</h2><button type="button" class="x" data-close>×</button></div><p class="muted">이 브라우저에서 사용할 임시 닉네임입니다.</p><input id="nickInput" maxlength="24" required><div class="actions"><button type="button" class="ghost" data-close>취소</button><button class="primary">저장</button></div></form></dialog><dialog id="loginDialog"><form id="loginForm"><div class="dialogHead"><h2>운영 콘솔</h2><button type="button" class="x" data-close>×</button></div><p class="muted">승인된 운영 계정만 접근할 수 있습니다.</p><label>아이디<input id="adminUser" autocomplete="username" required></label><label>비밀번호<input id="adminPass" type="password" autocomplete="current-password" required></label><div class="actions"><button class="primary">보안 로그인</button></div></form></dialog><dialog id="adminDialog"><div id="adminPanel"></div></dialog><div id="toast"></div><script src="/assets/app.js" defer></script></body></html>
