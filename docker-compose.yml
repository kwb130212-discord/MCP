services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cathero
      POSTGRES_USER: cathero
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cathero -d cathero"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://cathero:change-this-password@db:5432/cathero
      MCP_TOKEN: replace-with-a-real-token
      MCP_ALLOWED_HOSTS: 127.0.0.1:*
      MCP_ALLOWED_ORIGINS: http://127.0.0.1:*
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
