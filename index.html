<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f5">
<title>세공 기록</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#222;font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:520px;margin:0 auto;padding:26px 18px 40px}header{font-size:13px;color:#777;border-bottom:1px solid #ddd;padding-bottom:13px}.hero{padding:26px 0 20px}h1{font-size:27px;letter-spacing:-1.2px;margin:0 0 5px}.sub{color:#777;font-size:13px}.recommend{background:#222;color:#fff;border-radius:8px;padding:20px;margin:8px 0 14px}.recommend small{color:#bbb}.recommend strong{display:block;font-size:32px;line-height:1.2;margin:5px 0}.recommend p{font-size:13px;color:#ccc;margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{background:#fff;border:1px solid #e1e1dd;border-radius:7px;padding:12px 9px;text-align:center}.item b{display:block;font-size:18px}.item span{font-size:11px;color:#777}.item.active{border:2px solid #222;padding:11px 8px}.item.done{background:#ededeb}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.actions button{border:0;border-radius:7px;padding:15px;font-size:15px;font-weight:700}.ok{background:#253e2e;color:white}.fail{background:#eee;color:#333}.actions button:disabled{opacity:.3}.summary{font-size:12px;color:#777;margin:10px 0 18px}.history{border-top:1px solid #ddd;padding-top:13px}.history h2{font-size:14px;margin:0 0 8px}.log{font-size:12px;color:#666;max-height:150px;overflow:auto}.log div{padding:5px 0;border-bottom:1px solid #ececea}.tools{display:flex;justify-content:space-between;margin-top:16px}.tools button{background:none;border:0;color:#888;text-decoration:underline;font-size:12px;padding:4px}.hint{font-size:12px;color:#888;margin-top:16px}@media(min-width:600px){main{padding-top:40px}}
</style>
</head>
<body><main>
<header>개인 세공 기록 · 자동 추천</header>
<section class="hero"><h1>다음은 어디를 올릴까?</h1><div class="sub">성공 / 실패만 기록하면 다음 번호를 자동으로 골라줘.</div></section>
<section class="recommend"><small>다음 강화 추천</small><strong id="next">1번</strong><p id="reason">1번 좋은 옵션을 먼저 목표로 진행해.</p></section>
<section class="grid" id="items"></section>
<div class="actions"><button class="ok" id="success">성공</button><button class="fail" id="failure">실패</button></div>
<div class="summary" id="summary">총 0회 기록</div>
<section class="history"><h2>최근 기록</h2><div class="log" id="log">기록 없음</div></section>
<div class="tools"><button id="undo">마지막 기록 취소</button><button id="reset">초기화</button></div>
<div class="hint">목표: 1번 9승 이상 · 2번 9승 이상 · 3번 3승 이하 (각 10회)</div>
</main>
<script>
const KEY="stone-auto-priority-v3";
const labels=["1번 · 좋은 옵션","2번 · 서브 옵션","3번 · 안 좋은 옵션"];
let state={items:[[],[],[]],history:[]};
const $=id=>document.getElementById(id);
function wins(i){return state.items[i].filter(Boolean).length}
function choose(){
 // 1번을 최우선, 달성 후 2번, 마지막으로 3번을 낮게 유지한다.
 if(state.items[0].length<10 && wins(0)<9)return 0;
 if(state.items[1].length<10 && wins(1)<9)return 1;
 if(state.items[2].length<10 && wins(2)>3)return 2;
 if(state.items[2].length<10)return 2;
 if(state.items[0].length<10)return 0;
 if(state.items[1].length<10)return 1;
 return -1;
}
function explain(i){
 if(i<0)return "모든 항목의 10회 기록이 끝났어.";
 if(i===0)return "좋은 옵션이야. 10번 안에 성공 9번을 목표로 먼저 진행해.";
 if(i===1)return "1번 목표를 마쳤어. 이제 서브 옵션을 9승 목표로 진행해.";
 return wins(2)<=3?"3번은 성공을 더 만들지 말고 실패 쪽으로 관리해.":"3번 성공이 3회를 넘었어. 남은 시도는 실패를 목표로 해.";
}
function render(){
 const i=choose(),total=state.items.reduce((n,a)=>n+a.length,0);
 $("next").textContent=i<0?"완료":(i+1)+"번";
 $("reason").textContent=explain(i);
 $("items").innerHTML=state.items.map((a,n)=>'<div class="item '+(n===i?"active ":"")+(a.length===10?"done":"")+'"><b>'+wins(n)+'승 '+(a.length-wins(n))+'패</b><span>'+labels[n]+'</span><span>'+a.length+'/10회</span></div>').join("");
 $("success").disabled=i<0||state.items[i].length>=10|| (i===2&&wins(2)>=3);
 $("failure").disabled=i<0||state.items[i].length>=10;
 $("summary").textContent="총 "+total+" / 30회 기록 · 목표 1번 9승 / 2번 9승 / 3번 3승 이하";
 $("log").innerHTML=state.history.length?state.history.slice().reverse().slice(0,25).map(h=>'<div>'+(h.i+1)+'번 · '+(h.ok?"성공":"실패")+' · '+h.wins+'승 '+h.losses+'패</div>').join(""):"기록 없음";
 try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
}
function record(ok){const i=choose();if(i<0)return;if(i===2&&ok&&wins(2)>=3)return;state.items[i].push(ok);state.history.push({i,ok,wins:wins(i),losses:state.items[i].length-wins(i)});render()}
$("success").onclick=()=>record(true);$("failure").onclick=()=>record(false);
$("undo").onclick=()=>{const h=state.history.pop();if(!h)return;state.items[h.i].pop();render()};
$("reset").onclick=()=>{if(confirm("기록을 전부 초기화할까?")){state={items:[[],[],[]],history:[]};render()}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items)&&s.items.length===3&&Array.isArray(s.history))state=s}catch(e){}
render();
</script></body></html>
